<script>
  if(location.protocol==='file:')window.addEventListener('DOMContentLoaded',()=>{
    const notice=document.createElement('div');notice.className='local-file-notice';
    notice.innerHTML='<section><h1>LeVo</h1><h2>Open the online app / Mở ứng dụng trực tuyến</h2><p>This is the source-code file. Audio, Speaking and classrooms need the LeVo server.<br><span lang="vi">Đây là file mã nguồn. Âm thanh, Speaking và lớp học cần kết nối máy chủ LeVo.</span></p><a class="btn primary" href="https://lexilab-stem-vn-qn16.quynhthinhuto.chatgpt.site/">Open LeVo / Mở LeVo ↗</a><p>To run locally, read README.md and start the preview server.<br><span lang="vi">Để chạy trên máy, làm theo README.md và mở máy chủ xem thử.</span></p><code>node scripts/preview.mjs</code></section>';

<body>
  <div id="app"></div>
  <section id="pronunciation-player" class="pronunciation-player" aria-label="Pronunciation / Phát âm" hidden>
    <div class="pronunciation-heading"><span>PRONUNCIATION</span><button type="button" data-action="audio-close" aria-label="Close audio / Đóng âm thanh">×</button></div>

    <p id="pronunciation-meaning" lang="vi"></p>
    <audio id="pronunciation-audio" hidden controls preload="none" playsinline aria-label="Play English pronunciation / Phát âm tiếng Anh" tabindex="0"></audio>
    <p id="pronunciation-status" class="pronunciation-status" role="status" aria-live="polite"></p>
    <button type="button" class="btn primary" data-action="audio-replay">Play</button>
    <details><summary>Help</summary><div class="pronunciation-actions"><a id="pronunciation-open" target="_blank" rel="noopener">Open audio ↗</a><button type="button" data-action="audio-alternate">Other player</button></div><p>Check media volume or try Open audio.</p></details>
  </section>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
